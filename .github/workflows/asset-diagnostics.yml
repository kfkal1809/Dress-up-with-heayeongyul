name: Dress-up asset diagnostics

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/diagnostics/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: checkout
        uses: actions/checkout@v4
      - id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: npm_ci
        name: npm ci
        continue-on-error: true
        run: npm ci
      - id: build
        name: Production build
        continue-on-error: true
        if: steps.npm_ci.outcome == 'success'
        run: npm run build
      - id: recovery
        name: Inspect corrupt asset recovery candidates
        continue-on-error: true
        run: node .github/scripts/recover-corrupt-assets.mjs
      - id: install_deps
        name: Install diagnostic dependencies
        continue-on-error: true
        if: steps.npm_ci.outcome == 'success'
        run: npm install --no-save playwright pngjs
      - id: install_browser
        name: Install Chromium
        continue-on-error: true
        if: steps.install_deps.outcome == 'success'
        run: npx playwright install --with-deps chromium
      - id: preview
        name: Start local preview
        continue-on-error: true
        if: steps.build.outcome == 'success'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/dressup-preview.log 2>&1 &
          echo $! > /tmp/dressup-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dressup-preview.log
          exit 1
      - id: diagnose
        name: Run browser and asset diagnostics
        continue-on-error: true
        if: steps.install_browser.outcome == 'success' && steps.preview.outcome == 'success'
        run: node .github/scripts/asset-diagnostics.mjs
      - name: Persist diagnostics status and report
        if: always() && github.event_name != 'pull_request'
        env:
          NPM_CI: ${{ steps.npm_ci.outcome }}
          BUILD: ${{ steps.build.outcome }}
          INSTALL_DEPS: ${{ steps.install_deps.outcome }}
          INSTALL_BROWSER: ${{ steps.install_browser.outcome }}
          PREVIEW: ${{ steps.preview.outcome }}
          DIAGNOSE: ${{ steps.diagnose.outcome }}
        run: |
          mkdir -p .github/diagnostics
          cat > .github/diagnostics/workflow-status.json <<EOF
          {
            "sha": "${GITHUB_SHA}",
            "npmCi": "${NPM_CI}",
            "build": "${BUILD}",
            "installDeps": "${INSTALL_DEPS}",
            "installBrowser": "${INSTALL_BROWSER}",
            "preview": "${PREVIEW}",
            "diagnose": "${DIAGNOSE}"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/diagnostics/
          git commit -m 'test: update asset diagnostics [skip ci]' || exit 0
          git push
      - name: Upload screenshots, source assets, recovery candidates and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dress-up-asset-diagnostics
          path: |
            test-results/
            .github/diagnostics/latest.json
            public/assets/sprites/
          if-no-files-found: ignore
